<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasarela 3D · Paul Artspace</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182628;color:#eae2d3;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;z-index:2;top:18px;left:18px;max-width:min(390px,calc(100vw - 36px));padding:16px 18px;border:1px solid #ccb99a40;border-radius:12px;background:#111b1eea;box-shadow:0 12px 40px #0005}
.kicker{font-size:10px;letter-spacing:.18em;color:#8de0d4;text-transform:uppercase}h1{font-size:20px;letter-spacing:.02em;margin:7px 0}p{font-size:13px;line-height:1.45;color:#c4c8bd;margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;font-size:12px;color:#ecede3;border:1px solid #c8c8ac55;background:#ffffff10;padding:9px 12px;border-radius:6px;text-decoration:none;cursor:pointer}button.active{background:#a4ded3;color:#102321;border-color:#a4ded3}a{display:inline-block;margin-top:10px;color:#a4ded3}
#error{display:none;position:absolute;left:20px;right:20px;bottom:20px;background:#351d1d;padding:14px;border-radius:6px}
@media(max-width:600px){.panel{top:10px;left:10px;max-width:calc(100vw - 20px);padding:12px}h1{font-size:17px}p{font-size:12px;margin-bottom:8px}button{padding:8px 10px}}
</style>
</head>
<body>
<div class="panel">
  <div class="kicker">Paul Artspace · studiu de detaliu</div>
  <h1>Pasarelele metalice 3D</h1>
  <p>Lățime 1,50 m · îmbinări, balustrade și susținere arcuită. Trage pe imagine pentru a roti privirea.</p>
  <div class="actions"><button id="overhead" class="active">Puntea de sus</button><button id="inside">Pe pasarelă</button><button id="overview">Vedere de ansamblu</button></div>
  <a href="./">Înapoi la atelier ↗</a>
</div>
<div id="error">Vizualizarea are nevoie de un browser cu WebGL activ.</div>
<script type="module" src="./pasarela-preview.js?v=3"></script>
</body>
</html>
